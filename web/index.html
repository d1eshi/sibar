<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sibar Reader</title>
<script>
window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
window.va("beforeSend", (event) => {
  if (location.hostname === "localhost" || location.hostname === "127.0.0.1") return null;
  if (event?.url) {
    const url = new URL(event.url);
    url.search = "";
    url.hash = "";
    return { ...event, url: url.href };
  }
  return event;
});
if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
  const analyticsScript = document.createElement("script");
  analyticsScript.defer = true;
  analyticsScript.src = "/_vercel/insights/script.js";
  document.head.appendChild(analyticsScript);
}
</script>
<link rel="stylesheet" href="/styles/reader.css">
</head>
<body>
<main>
  <section class="start-screen" id="startView">
    <p class="brand-mark">Sibar</p>
    <h1 class="start-mark">Reader</h1>
    <p class="start-subtitle">Lee, selecciona y guarda lo importante.</p>

    <form class="ingest-form" id="loadForm">
      <label class="ingest-label" for="urlInput">Pega una fuente</label>
      <div class="ingest-row">
        <input class="source-input" id="urlInput" type="url" placeholder="https://..." autocomplete="url">
        <button class="primary-btn" type="submit">Cargar</button>
        <button class="secondary-btn" type="button" id="sampleBtn">Demo</button>
      </div>
    </form>

    <section class="source-examples" aria-label="Ejemplos de fuentes">
      <button class="source-chip" type="button"><span>01</span> Articulo</button>
      <button class="source-chip" type="button"><span>02</span> Paper</button>
      <button class="source-chip" type="button"><span>03</span> Newsletter</button>
      <button class="source-chip" type="button"><span>04</span> Post tecnico</button>
    </section>

    <section class="recent-sources" id="recentSources" aria-label="Lecturas recientes" hidden>
      <div class="recent-header">
        <span>Recientes</span>
        <span id="historyCount">0</span>
      </div>
      <nav class="history-list" id="historyList" aria-label="Ultimos articulos leidos"></nav>
    </section>

    <section class="ghost-reader" aria-label="Vista de lectura futura">
      <div class="ghost-line title"></div>
      <div class="ghost-line mid"></div>
      <div class="ghost-line mid"></div>
      <div class="ghost-line"></div>
      <div class="ghost-line short"></div>
      <br>
      <div class="ghost-line mid"></div>
      <div class="ghost-line"></div>
      <div class="ghost-line"></div>
      <div class="ghost-line mid"></div>
    </section>
    <p class="screen-status" id="status"></p>
  </section>

  <section class="loading-screen" id="loadingView" hidden>
    <div class="loading-block">
      <p class="loading-kicker">Cargando fuente</p>
      <div class="loading-title"></div>
      <div class="loading-line"></div>
      <div class="loading-line wide"></div>
      <div class="loading-line short"></div>
    </div>
  </section>

  <section class="reader-view" id="readerView" hidden>
    <header class="saved-header">
      <div class="sibi-wordmark">Sibar</div>
    </header>

    <main class="article-shell">
      <article class="article" id="article">
        <div class="source-row">
          <span id="hostLabel"></span>
          <span class="divider" aria-hidden="true"></span>
          <span id="paragraphCount"></span>
        </div>

        <h1 id="articleTitle"></h1>
        <div class="article-rule"></div>
        <div class="article-body" id="articleBody"></div>
      </article>
    </main>
  </section>
</main>

<form class="save-popover floating" id="selectionCard" hidden>
  <div class="card-label">Seleccion</div>
  <p class="selection-text" id="selectionText"></p>
  <textarea id="selectionNote" placeholder="Nota breve..."></textarea>
  <div class="kind-row" role="tablist" aria-label="Tipo de nota">
    <button class="small kind-btn active" type="button" role="tab" aria-selected="true" data-kind="highlight">Highlight</button>
    <button class="small kind-btn" type="button" role="tab" aria-selected="false" data-kind="question">Pregunta</button>
    <button class="small kind-btn" type="button" role="tab" aria-selected="false" data-kind="key">Idea</button>
  </div>
  <div class="actions">
    <button class="primary-btn small" type="button" id="saveSelectionBtn">Guardar</button>
    <button class="secondary-btn small" type="button" id="clearSelectionBtn">Cancelar</button>
  </div>
</form>

<aside class="saved-drawer" id="savedDrawer" hidden>
  <header class="saved-drawer-header">
    <div>
      <p class="drawer-kicker">Sibar / Reader</p>
      <h2>Guardadas</h2>
    </div>
    <button class="icon-btn" type="button" id="closeSavedBtn" aria-label="Cerrar">×</button>
  </header>
  <section class="loose-note">
    <textarea id="looseNote" placeholder="Nota atomica..."></textarea>
    <button class="primary-btn small" type="button" id="saveLooseBtn">Guardar nota</button>
  </section>
  <section class="notes" id="notes"></section>
</aside>

<button class="saved-chip" type="button" id="savedChip" hidden>0 guardadas</button>
<div class="saved-toast" id="savedToast" hidden>Guardado</div>

<div class="toolbar" id="selectionToolbar">
  <button type="button" data-toolbar-kind="highlight">Highlight</button>
  <button type="button" data-toolbar-kind="question">Pregunta</button>
  <button type="button" data-toolbar-kind="key">Idea</button>
</div>

<script type="module" src="/scripts/app.js"></script>
</body>
</html>
