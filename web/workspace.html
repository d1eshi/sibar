<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sibar Workspace — Deep Ownership</title>
<style>
/* ── CSS Custom Properties ── */
:root {
  --surface: #fafaf9;
  --surface-warm: #f5f3f0;
  --surface-raised: #ffffff;
  --text-primary: #1c1917;
  --text-secondary: #57534e;
  --text-muted: #a8a29e;
  --divider: #e7e5e4;
  --divider-thin: #f0efed;
  --teal: #0d9488;
  --teal-light: #ccfbf1;
  --teal-bg: #f0fdfa;
  --amber: #d97706;
  --amber-light: #fef3c7;
  --amber-bg: #fffbeb;
  --red: #dc2626;
  --red-light: #fecaca;
  --red-bg: #fef2f2;
  --green: #16a34a;
  --green-bg: #f0fdf4;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", Menlo, monospace;
  --radius: 6px;
  --radius-sm: 3px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
}

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--surface);
  color: var(--text-primary);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── Workspace Grid ── */
.workspace {
  display: grid;
  grid-template-columns: 280px 1fr 320px;
  grid-template-rows: 1fr auto;
  grid-template-areas:
    "boundary artifact loop"
    "evidence evidence evidence";
  height: 100vh;
  gap: 0;
}

/* ── Top Bar ── */
.top-bar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--divider);
  background: var(--surface-raised);
  z-index: 10;
}
.top-bar .brand {
  font-weight: 700;
  font-size: 14px;
  color: var(--teal);
  letter-spacing: -0.02em;
}
.top-bar .breadcrumb {
  font-size: 12px;
  color: var(--text-muted);
}
.top-bar .state-badge {
  margin-left: auto;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  background: var(--teal-bg);
  color: var(--teal);
  border: 1px solid var(--teal-light);
  font-weight: 500;
}

/* ── Rail (shared) ── */
.rail {
  overflow-y: auto;
  padding: 16px;
  border-right: 1px solid var(--divider);
  background: var(--surface-raised);
}
.rail h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 12px;
  font-weight: 600;
}

/* ── Boundary Rail ── */
.boundary-rail {
  grid-area: boundary;
  border-right: 1px solid var(--divider);
}
.boundary-rail h2 { color: var(--teal); }

.goal-block {
  margin-bottom: 16px;
  padding: 10px 12px;
  background: var(--teal-bg);
  border-left: 3px solid var(--teal);
  border-radius: var(--radius-sm);
}
.goal-block .goal-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--teal);
  font-weight: 600;
  margin-bottom: 4px;
}
.goal-block p {
  font-size: 13px;
  line-height: 1.45;
  color: var(--text-primary);
}

.boundary-section {
  margin-bottom: 14px;
}
.boundary-section h3 {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}

.src-list {
  list-style: none;
  font-size: 12px;
  font-family: var(--font-mono);
}
.src-list li {
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.src-list li.included { border-left: 2px solid var(--teal); color: var(--text-primary); }
.src-list li.excluded {
  color: var(--text-muted);
  text-decoration: line-through;
  text-decoration-color: var(--divider);
}

.concept-chip {
  display: inline-block;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  background: var(--amber-bg);
  color: var(--amber);
  border: 1px solid var(--amber-light);
  font-weight: 500;
  margin-bottom: 4px;
}

.unknown-zone-item {
  padding: 6px 8px;
  margin-bottom: 6px;
  border: 1px dashed var(--amber);
  border-radius: var(--radius-sm);
  background: var(--amber-bg);
  font-size: 11px;
}
.unknown-zone-item .uz-path {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--amber);
  font-weight: 500;
}
.unknown-zone-item .uz-reason {
  color: var(--text-secondary);
  margin-top: 2px;
  font-size: 10px;
}
.unknown-zone-item .uz-open {
  color: var(--text-muted);
  font-size: 10px;
  font-style: italic;
  margin-top: 2px;
}

.skip-summary {
  font-size: 11px;
  color: var(--text-muted);
  padding: 6px 8px;
  background: var(--surface-warm);
  border-radius: var(--radius-sm);
}
.skip-summary .skip-count { font-weight: 600; color: var(--text-secondary); }
.skip-summary details { margin-top: 4px; }
.skip-summary summary { cursor: pointer; font-size: 10px; color: var(--text-muted); }
.skip-summary ul { font-size: 10px; padding-left: 14px; margin-top: 3px; }
.skip-summary ul li { color: var(--text-muted); }

/* ── Artifact Canvas ── */
.artifact-canvas {
  grid-area: artifact;
  overflow-y: auto;
  padding: 20px 24px;
  background: var(--surface);
}
.artifact-canvas h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 14px;
  font-weight: 600;
}

.artifact-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.artifact-header .kind-badge {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: var(--radius-sm);
  background: var(--surface-warm);
  color: var(--text-secondary);
  font-weight: 500;
  border: 1px solid var(--divider);
}
.artifact-header .artifact-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
}
.artifact-header .ro-badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: var(--radius-sm);
  background: var(--amber-bg);
  color: var(--amber);
  border: 1px solid var(--amber-light);
  font-weight: 500;
}
.artifact-header .purpose {
  width: 100%;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-top: 4px;
}

.artifact-toggle {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
}
.artifact-toggle button {
  font-size: 12px;
  padding: 5px 14px;
  border: 1px solid var(--divider);
  background: var(--surface-raised);
  border-radius: var(--radius);
  cursor: pointer;
  color: var(--text-secondary);
  font-weight: 500;
  transition: all 0.15s;
}
.artifact-toggle button.active {
  background: var(--teal);
  color: white;
  border-color: var(--teal);
}

/* ── Code Viewer ── */
.code-viewer {
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  background: var(--surface-raised);
  overflow: hidden;
  margin-bottom: 20px;
}
.code-viewer .cv-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--divider-thin);
  background: var(--surface-warm);
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text-secondary);
}
.code-viewer .cv-header .file-path {
  font-weight: 500;
  color: var(--text-primary);
}
.cv-actions {
  display: flex;
  gap: 6px;
}
.cv-actions button {
  font-size: 10px;
  padding: 3px 8px;
  border: 1px solid var(--divider);
  background: var(--surface-raised);
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-secondary);
  font-family: var(--font-sans);
}
.cv-actions button:hover {
  background: var(--teal-bg);
  border-color: var(--teal);
  color: var(--teal);
}
.code-lines {
  overflow-x: auto;
}
.code-line {
  display: flex;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  min-height: 20px;
}
.code-line .ln {
  width: 48px;
  flex-shrink: 0;
  text-align: right;
  padding: 0 10px 0 6px;
  color: var(--text-muted);
  user-select: none;
  background: var(--surface-warm);
  border-right: 1px solid var(--divider-thin);
  font-size: 11px;
}
.code-line .cl {
  padding: 0 12px;
  white-space: pre;
  color: var(--text-primary);
}
.code-line.hidden-line .ln,
.code-line.hidden-line .cl {
  color: var(--text-muted);
  font-style: italic;
  background: var(--surface-warm);
}
.code-line.hidden-line .cl::before {
  content: "⋯ ";
  color: var(--amber);
  font-style: normal;
}
.code-line.in-range {
  background: var(--teal-bg);
}
.code-line.in-range .ln {
  background: var(--teal-bg);
  color: var(--teal);
  font-weight: 600;
}
.code-line.in-range.hidden-line {
  background: var(--amber-bg);
}
.code-line.in-range.hidden-line .ln {
  background: var(--amber-bg);
}

.cv-related {
  padding: 8px 12px;
  border-top: 1px solid var(--divider-thin);
  font-size: 11px;
  color: var(--text-muted);
  background: var(--surface-warm);
}
.cv-related span { font-weight: 500; color: var(--text-secondary); }

.cv-symbols {
  padding: 8px 12px;
  border-top: 1px solid var(--divider-thin);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.cv-symbols .sym-chip {
  font-size: 10px;
  font-family: var(--font-mono);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  background: var(--surface-warm);
  color: var(--text-secondary);
  border: 1px solid var(--divider);
}

.cv-citation {
  margin-top: 12px;
  padding: 8px 12px;
  border-radius: var(--radius);
  background: var(--amber-bg);
  border: 1px solid var(--amber-light);
  font-size: 11px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.cv-citation .role-badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: var(--radius-sm);
  background: var(--amber-light);
  color: var(--amber);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* ── Flow Diagram ── */
.flow-diagram {
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  background: var(--surface-raised);
  padding: 20px;
  margin-bottom: 20px;
}
.flow-nodes {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.flow-node {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-left: 3px solid var(--divider);
  position: relative;
  transition: background 0.15s;
}
.flow-node + .flow-node { margin-top: 0; }
.flow-node .connector {
  position: absolute;
  left: -1px;
  top: -8px;
  bottom: -8px;
  width: 1px;
  background: var(--divider);
  z-index: 0;
}
.flow-node:first-child .connector { top: 50%; }
.flow-node:last-child .connector { bottom: 50%; }
.flow-node .node-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid var(--divider);
  background: var(--surface-raised);
  flex-shrink: 0;
  z-index: 1;
}
.flow-node.entry .node-dot {
  background: var(--teal);
  border-color: var(--teal);
  box-shadow: 0 0 0 3px var(--teal-light);
}
.flow-node.terminal .node-dot {
  background: var(--amber);
  border-color: var(--amber);
  box-shadow: 0 0 0 3px var(--amber-light);
}
.flow-node.process .node-dot {
  background: var(--surface-raised);
  border-color: var(--teal);
}
.flow-node.data .node-dot {
  border-style: dashed;
  border-color: var(--text-muted);
}
.flow-node.output .node-dot {
  background: var(--surface-raised);
  border-color: var(--amber);
}
.flow-node.inferred { opacity: 0.7; }
.flow-node.inferred .node-dot { border-style: dotted; }
.flow-node .node-label {
  font-size: 13px;
  font-weight: 500;
  z-index: 1;
}
.flow-node .node-role {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-left: auto;
  z-index: 1;
}
.flow-node .node-ev {
  font-size: 9px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-left: 6px;
}
.flow-node .node-prompt {
  font-size: 10px;
  color: var(--text-muted);
  font-style: italic;
  margin-top: 2px;
  display: block;
  z-index: 1;
}

.edge-legend {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--divider-thin);
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 10px;
  color: var(--text-muted);
}
.edge-legend span {
  display: flex;
  align-items: center;
  gap: 4px;
}
.edge-legend .legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: var(--teal);
  opacity: 0.4;
}

/* ── Loop Rail ── */
.loop-rail {
  grid-area: loop;
  border-right: none;
  border-left: 1px solid var(--divider);
}
.loop-rail h2 { color: var(--amber); }

.operation-block {
  margin-bottom: 16px;
  padding: 10px 12px;
  background: var(--amber-bg);
  border-left: 3px solid var(--amber);
  border-radius: var(--radius-sm);
}
.operation-block .op-kind {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--amber);
  font-weight: 600;
  margin-bottom: 4px;
}
.operation-block .op-prompt {
  font-size: 13px;
  line-height: 1.45;
  color: var(--text-primary);
}

.success-criteria {
  margin-bottom: 14px;
}
.success-criteria h3 {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.success-criteria ul {
  list-style: none;
  font-size: 11px;
}
.success-criteria ul li {
  padding: 2px 6px;
  color: var(--text-muted);
}
.success-criteria ul li::before {
  content: "○ ";
  color: var(--divider);
  font-size: 10px;
}

.blocked-shortcuts {
  margin-bottom: 14px;
  font-size: 10px;
  color: var(--red);
  padding: 6px 8px;
  background: var(--red-bg);
  border-radius: var(--radius-sm);
  border: 1px solid var(--red-light);
}
.blocked-shortcuts h3 {
  font-size: 10px;
  font-weight: 600;
  margin-bottom: 3px;
  color: var(--red);
}

.attempt-composer {
  border: 1px solid var(--divider);
  border-radius: var(--radius);
  background: var(--surface-raised);
  margin-bottom: 14px;
}
.attempt-composer .ac-header {
  padding: 8px 10px;
  border-bottom: 1px solid var(--divider-thin);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--surface-warm);
}
.attempt-composer textarea {
  width: 100%;
  min-height: 100px;
  border: none;
  padding: 10px;
  font-family: var(--font-sans);
  font-size: 12px;
  line-height: 1.5;
  resize: vertical;
  background: var(--surface-raised);
  color: var(--text-primary);
  outline: none;
}
.attempt-composer textarea:focus {
  background: var(--teal-bg);
}

.confidence-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-top: 1px solid var(--divider-thin);
  font-size: 11px;
}
.confidence-row label { color: var(--text-muted); }
.confidence-row select {
  font-size: 11px;
  padding: 2px 6px;
  border: 1px solid var(--divider);
  border-radius: var(--radius-sm);
  background: var(--surface-raised);
  color: var(--text-primary);
}

.unknowns-input {
  padding: 6px 10px;
  border-top: 1px solid var(--divider-thin);
}
.unknowns-input input {
  width: 100%;
  font-size: 11px;
  padding: 4px 8px;
  border: 1px solid var(--divider);
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
}

.attempt-actions {
  display: flex;
  gap: 6px;
  padding: 8px 10px;
  border-top: 1px solid var(--divider-thin);
}
.attempt-actions button {
  font-size: 11px;
  padding: 5px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 500;
  border: 1px solid var(--divider);
  background: var(--surface-raised);
  color: var(--text-secondary);
}
.attempt-actions button.submit-btn {
  background: var(--teal);
  color: white;
  border-color: var(--teal);
}
.attempt-actions button.submit-btn:hover { background: #0f766e; }
.attempt-actions button.dunno-btn { color: var(--amber); border-color: var(--amber); }
.attempt-actions button.sample-btn { color: var(--text-muted); font-size: 10px; }
.attempt-actions button:disabled { opacity: 0.5; cursor: not-allowed; }

.hint-ladder {
  margin-bottom: 14px;
}
.hint-ladder h3 {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.hint-ladder .hint {
  padding: 6px 8px;
  margin-bottom: 4px;
  border-left: 3px solid var(--divider);
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.15s;
}
.hint-ladder .hint.revealed {
  border-left-color: var(--teal);
  color: var(--text-primary);
  background: var(--teal-bg);
}
.hint-ladder .hint .hint-num {
  font-weight: 600;
  color: var(--teal);
  margin-right: 4px;
  font-size: 10px;
}
.hint-ladder .hint .hint-hidden {
  display: none;
  font-style: italic;
  font-size: 10px;
}
.hint-ladder .hint.revealed .hint-hidden {
  display: block;
  margin-top: 4px;
  color: var(--text-secondary);
}

/* ── Pre-Attempt State: Evidence Selection ── */
.evidence-selector {
  border-top: 1px solid var(--divider-thin);
  padding: 6px 10px;
  max-height: 160px;
  overflow-y: auto;
}
.evidence-selector label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-secondary);
  padding: 2px 0;
  cursor: pointer;
}
.evidence-selector label:hover { color: var(--text-primary); }
.evidence-selector input[type="checkbox"] {
  width: 13px;
  height: 13px;
  accent-color: var(--teal);
  cursor: pointer;
}
.evidence-selector .ev-sel-role {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--teal);
  margin-left: auto;
}

/* ── Prerequisite Route ── */
.prereq-route {
  margin-bottom: 12px;
  padding: 8px 10px;
  border: 1px dashed var(--amber);
  border-radius: var(--radius);
  background: var(--amber-bg);
}
.prereq-route h3 {
  font-size: 10px;
  font-weight: 600;
  color: var(--amber);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.prereq-route .prereq-chip {
  display: inline-block;
  font-size: 10px;
  padding: 2px 8px;
  margin: 2px;
  border-radius: var(--radius-sm);
  background: var(--amber-light);
  color: var(--amber);
  font-weight: 500;
  border: 1px solid var(--amber);
}
.prereq-route .prereq-note {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 4px;
  font-style: italic;
}

/* ── State Chain Progress ── */
.state-chain {
  margin-bottom: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  align-items: center;
}
.state-chain .sc-step {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  background: var(--surface-warm);
  color: var(--text-muted);
  border: 1px solid var(--divider);
  white-space: nowrap;
}
.state-chain .sc-step.completed {
  background: var(--teal-bg);
  color: var(--teal);
  border-color: var(--teal-light);
}
.state-chain .sc-step.active {

  function renderCodeSlice(art) {

        html += '<span class="ln" style="color:var(--amber);">' + hiddenStart + '-' + (hiddenStart + hiddenCount - 1) + '</span>';
        html += '<span class="cl">// ' + hiddenCount + ' lines hidden — solution evidence (expand in full workspace)</span>';
        html += '</div>';
      } else {
        html += '<div class="code-line in-range selectable" data-line="' + i + '" tabindex="0" role="option" aria-label="Line ' + i + '">';
        html += '<span class="ln">' + i + '</span>';
        html += '<span class="cl">' + esc(generateCodeLine(i, false, symbols)) + '</span>';
        html += '</div>';
        i++;
      }

    html += '</div>'; // end code-lines

    // Related info
    if (relatedTests.length > 0) {
      html += '<div class="cv-related">';

      html += '</div>';

    html += '</div>'; // end code-viewer

    // Citation metadata
    html += '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">';

      html += ' — <span style="font-size:10px;color:var(--text-secondary);">' + esc(r.label) + '</span>';
      html += '</div>';

    html += '</div>';

    return html;

  function generateCodeLine(lineNum, isHidden, symbols) {
    if (isHidden) return "// [hidden line — solution evidence]";
    var lines = [
      "/**",
      " * detectLearningGapFromAnswer",
      " * Maps an answer_quality to a typed LearningGap with severity,",
      " * confidence, suspected_misconception, and repair_action.",
      " */",
      "export function detectLearningGapFromAnswer(",
      "  quality: AnswerQuality,",
      "  context: ArtifactAnswerContext",
      "): LearningGap {",
      "  const layer = observedLayer(context, quality);",
      "  const severity = severityFor(quality, layer);",
      "  const confidence = confidenceFor(quality, severity);",
      "  const misconception = misconceptionFor(quality, context);",
      "  const repair = repairActionFor(quality, severity, misconception);",
      "",
      "  return {",
      "    id: generateGapId(context.sessionId, quality),",
      "    quality,",
      "    layer,",
      "    severity,",
      "    confidence,",
      "    suspected_misconception: misconception,",
      "    repair_action: repair,",
      "    artifact_evidence: context.artifactEvidence,",
      "    created_at: new Date().toISOString(),",
      "    blocks_readiness: severity !== 'none'",
      "  };",
      "}",
      "",
      "/**",
      " * severityFor: maps answer quality to gap severity level.",
      " */",
      "function severityFor(quality: AnswerQuality, layer: ObservedLayer): Severity {",
      "  switch (quality) {",
      "    case 'verified': return 'none';",
      "    case 'partial':  return 'important';",
      "    case 'uncertain': return 'critical';",
      "    case 'wrong':    return 'critical';",
      "    case 'gap_confirmed': return 'critical';",
      "    default: return 'critical';",
      "  }",
      "}",
      "",
      "/**",
      " * confidenceFor: estimates confidence based on quality and severity.",
      " */",
      "function confidenceFor(quality: AnswerQuality, severity: Severity): Confidence {",
      "  if (quality === 'verified') return 'high';",
      "  if (quality === 'partial') return 'medium';",
      "  if (quality === 'gap_confirmed') return 'high';",
      "  return 'low';",
      "}",
      "",
      "/**",
      " * misconceptionFor: derives suspected misconception from answer content.",
      " */",
      "function misconceptionFor(",
      "  quality: AnswerQuality,",
      "  context: ArtifactAnswerContext",
      "): string | null {",
      "  if (quality === 'verified') return null;",
      "  if (quality === 'partial') {",
      "    return 'Incomplete understanding of severity branching based on quality';",
      "  }",
      "  return 'Fundamental misunderstanding of quality-to-severity mapping';",
      "}",
      "",
      "/**",
      " * repairActionFor: generates a concrete re-read/retry prompt.",
      " */",
      "function repairActionFor(",
      "  quality: AnswerQuality,",
      "  severity: Severity,",
      "  misconception: string | null",
      "): RepairAction {",
      "  return {",
      "    kind: 'trace',",
      "    prompt: generateRepairPrompt(quality, severity, misconception),",
      "    focus_lines: severityLinesFor(severity),",
      "    operation: 're-read-and-map'",
      "  };",
      "}"
    ];
    var idx = lineNum - 1;
    return idx >= 0 && idx < lines.length ? lines[idx] : "  const field = derive(" + lineNum + ");";
  }

  function renderFlowDiagram(art) {
    var p = art.payload;
    var nodes = p.nodes || [];
    var entryNode = p.entry_node;
    var terminalNodes = p.terminal_nodes || [];

    var html = '<div class="flow-diagram" data-component="call-data-diagram" data-component-label="Call/Data Diagram">';

    html += '<div class="artifact-header" style="margin-bottom:16px;">';
    html += '<span class="kind-badge">flow diagram</span>';
    html += '<span class="artifact-title" style="font-size:14px;">' + esc(art.title) + '</span>';
    html += '</div>';

    html += '<div class="flow-nodes">';
    nodes.forEach(function(node, idx) {
      var classes = [];
      if (node.id === entryNode) classes.push("entry");
      if (terminalNodes.indexOf(node.id) !== -1) classes.push("terminal");
      if (node.role === "process") classes.push("process");
      if (node.role === "data") classes.push("data");
      if (node.role === "output") classes.push("output");
      if (node.is_inferred) classes.push("inferred");

      html += '<div class="flow-node ' + classes.join(" ") + '">';
      html += '<div class="connector"></div>';
      html += '<div class="node-dot"></div>';
      html += '<div>';
      html += '<div class="node-label">' + esc(node.label) + '</div>';
      if (node.user_prompt) {
        html += '<span class="node-prompt">' + esc(node.user_prompt) + '</span>';
      }
      html += '</div>';
      html += '<span class="node-role">' + esc(node.role) + '</span>';
      if (node.evidence && node.evidence.length > 0) {
        html += '<span class="node-ev">' + node.evidence.map(function(e) { return esc(e); }).join(", ") + '</span>';
      }
      html += '</div>';
    });
    html += '</div>';

    // Edge legend
    html += '<div class="edge-legend">';
    html += '<span><span class="legend-dot"></span> Solid: direct evidence</span>';
    html += '<span><span class="legend-dot" style="border:1px dashed var(--text-muted);background:transparent;"></span> Dashed: inferred</span>';
    html += '<span>● Teal: entry node</span>';
    html += '<span>● Amber: terminal/output</span>';
    html += '</div>';

    // Edges summary
    html += '<div style="margin-top:12px;font-size:10px;color:var(--text-muted);">';
    html += '<strong>Edges:</strong> ';
    (p.edges || []).forEach(function(e) {
      html += e.from + ' → ' + e.to + ' [' + esc(e.relation) + (e.is_inferred ? ', inferred' : '') + '] ';
    });
    html += '</div>';

    html += '</div>'; // end flow-diagram
    return html;
  }

  // ── Hidden Answer Check ──
  // Asserts no hidden solution content is in DOM/accessibility text before attempt.
  function assertHiddenAnswerGated() {
    var hiddenEls = document.querySelectorAll("[aria-hidden=\"true\"], .hidden-line, .hidden-group");
    var failures = [];
    for (var i = 0; i < hiddenEls.length; i++) {
      var el = hiddenEls[i];
      var text = (el.textContent || "").trim();
      // If aria-hidden is set but text is visible, flag it
      if (el.getAttribute("aria-hidden") === "true") {
        // OK - this is properly gated
      } else if (el.classList.contains("hidden-line") || el.classList.contains("hidden-group")) {
        failures.push("Hidden content element found without aria-hidden: " + el.className);
      }
    }
    if (failures.length > 0) {
      console.warn("[Attempt-First Gate] Hidden answer leakage detected:", failures);
    }
    // Check that the post-attempt solution content is NOT in the DOM pre-attempt
    if (!state.attemptSubmitted) {
      var postEl = document.querySelector(".post-attempt");
      if (postEl) {
        console.warn("[Attempt-First Gate] Post-attempt content visible before submission!");
      }
    }
  }

  // ── Render: Loop Rail ──
  function renderLoop() {
    var html = "";
    var op = fixture.active_operation;
    var cs = fixture.concept_slice;
    var ls = fixture.loop_state;

    // ── State Chain Progress Indicator ──
    html += '<div class="state-chain" role="progressbar" aria-label="Loop state chain" aria-valuenow="' + ls.state_chain.indexOf(ls.current_state) + '" aria-valuemin="0" aria-valuemax="' + (ls.state_chain.length - 1) + '">';
    ls.state_chain.forEach(function(st, idx) {
      var cls = "sc-step";
      var currentIdx = ls.state_chain.indexOf(ls.current_state);
      if (idx < currentIdx) cls += " completed";
      else if (idx === currentIdx) cls += " active";
      else cls += " pending";
      html += '<span class="' + cls + '">' + esc(st) + '</span>';
      if (idx < ls.state_chain.length - 1) {
        html += '<span class="sc-arrow" aria-hidden="true">→</span>';
      }
    });
    html += '</div>';

    // Active operation
    html += '<div class="operation-block">';
    html += '<div class="op-kind">Active Operation: ' + esc(op.kind) + '</div>';
    html += '<div class="op-prompt">' + esc(op.prompt) + '</div>';
    html += '</div>';

    // Success criteria
    html += '<div class="success-criteria">';
    html += '<h3>Success Criteria</h3><ul>';
    op.success_criteria.forEach(function(sc) {
      html += '<li>' + esc(sc) + '</li>';
    });
    html += '</ul></div>';

    // Blocked shortcuts
    html += '<div class="blocked-shortcuts">';
    html += '<h3>🚫 Blocked Shortcuts</h3>';
    op.blocked_shortcuts.forEach(function(bs) {
      html += '<div>' + esc(bs) + '</div>';
    });
    html += '</div>';

    if (!state.attemptSubmitted) {
      // ── Prerequisite Route (visible before attempt, does not advance readiness) ──
      html += '<div class="prereq-route">';
      html += '<h3>📋 Prerequisites (no readiness advancement)</h3>';
      cs.prerequisite_concepts.forEach(function(pc) {
        html += '<span class="prereq-chip">' + esc(pc) + '</span>';
      });
      html += '<div class="prereq-note">These prerequisite concepts are visible before your attempt. Viewing prerequisite routes does not advance readiness — you must still attempt the active operation.</div>';
      html += '</div>';

      // ── Pre-attempt: composer ──
      html += '<div class="attempt-composer">';
      html += '<div class="ac-header">Attempt Composer</div>';
      html += '<textarea id="attemptText" placeholder="Write your trace, cite file:line evidence..." aria-label="Answer text input" aria-required="true"></textarea>';

      // Evidence selection
      html += '<div class="evidence-selector">';
      html += '<div style="font-size:10px;color:var(--text-muted);margin-bottom:4px;">Select evidence to cite (required: ' + op.required_evidence.join(", ") + ')</div>';
      fixture.evidence_inventory.forEach(function(ev) {
        var isRequired = op.required_evidence.indexOf(ev.id) !== -1;
        html += '<label>';
        html += '<input type="checkbox" class="ev-checkbox" data-ev-id="' + esc(ev.id) + '" ' + (isRequired ? 'checked' : '') + '>';
        html += esc(ev.id) + ' ' + esc(ev.path);
        html += '<span class="ev-sel-role">' + esc(ev.role.replace(/_/g, " ")) + '</span>';
        html += '</label>';
      });
      html += '</div>';

      html += '<div class="confidence-row">';
      html += '<label>Confidence:</label>';
      html += '<select id="attemptConfidence" aria-label="Confidence level">';
      html += '<option value="low">low</option>';
      html += '<option value="medium" selected>medium</option>';
      html += '<option value="high">high</option>';
      html += '</select>';
      html += '</div>';
      html += '<div class="unknowns-input">';
      html += '<input id="attemptUnknowns" placeholder="Declared unknowns (comma-separated)..." aria-label="Declared unknowns">';
      html += '</div>';
      html += '<div class="attempt-actions">';
      html += '<button class="submit-btn" id="submitAttempt">Submit</button>';
      html += '<button class="dunno-btn" id="dunnoAttempt">I Don\'t Know</button>';
      html += '<button class="sample-btn" id="useSampleAttempt">Use Sample Attempt</button>';
      html += '</div>';
      html += '</div>';

      // Hint ladder (never reveals hidden answer — VAL-LOOP-014)
      html += '<div class="hint-ladder">';
      html += '<h3>Hint Ladder (' + op.allowed_hints + ' available)</h3>';
      html += '<div class="hint" data-hint="1">';
      html += '<span class="hint-num">1</span> Look at the function signature — what fields does the return type declare?';
      html += '<div class="hint-hidden">The LearningGap interface has: id, quality, severity, confidence, suspected_misconception, repair_action, artifact_evidence, and blocks_readiness.</div>';
      html += '</div>';
      html += '<div class="hint" data-hint="2">';
      html += '<span class="hint-num">2</span> severityFor and confidenceFor are pure functions. What does each receive as arguments?';
      html += '<div class="hint-hidden">severityFor receives AnswerQuality and returns Severity. confidenceFor receives AnswerQuality + Severity and returns Confidence.</div>';
      html += '</div>';
      html += '<div class="hint" data-hint="3">';
      html += '<span class="hint-num">3</span> Map each quality value to its severity and confidence. Which case changes the most between partial and gap_confirmed?';
      html += '<div class="hint-hidden">partial → important severity / medium confidence. gap_confirmed → critical severity / high confidence. severityFor on line ~84. confidenceFor on line ~94.</div>';
      html += '</div>';
      html += '<div style="font-size:9px;color:var(--text-muted);margin-top:4px;">Hints orient attention and name evidence — they never reveal the hidden solution content before attempt (VAL-LOOP-014).</div>';
      html += '</div>';

    } else {
      // ── Post-attempt: evidence check, gap, repair, readiness ──
      var ec = fixture.evidence_check;
      var gap = fixture.detected_gap;
      var repair = fixture.repair_action;
      var rc = fixture.readiness_claim;
      var sa = fixture.sample_attempt;

      html += '<div class="post-attempt">';

      // Submitted attempt summary
      html += '<div style="margin-bottom:10px;padding:8px 10px;border:1px solid var(--divider);border-radius:var(--radius);background:var(--surface-warm);">';
      html += '<div style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);font-weight:600;margin-bottom:4px;">Your Attempt</div>';
      html += '<div style="font-size:11px;color:var(--text-primary);line-height:1.4;margin-bottom:4px;">' + esc(sa.answer_text.substring(0, 200));
      if (sa.answer_text.length > 200) html += '…';
      html += '</div>';
      html += '<div style="font-size:10px;color:var(--text-muted);">Confidence: ' + esc(sa.declared_confidence) + ' · Evidence selected: ' + esc(sa.selected_evidence.join(", ")) + ' · Unknowns: ' + sa.declared_unknowns.length + '</div>';
      html += '</div>';

      // Evidence check
      html += '<div class="evidence-check-block">';
      html += '<span class="ec-result ' + esc(ec.result) + '">Evidence Check: ' + esc(ec.result) + '</span>';
      html += '<div class="ec-observed"><strong>Observed:</strong><ul>';
      ec.observed_claims.forEach(function(c) { html += '<li>✓ ' + esc(c) + '</li>'; });
      html += '</ul></div>';
      html += '<div class="ec-missing"><strong>Missing:</strong><ul>';
      ec.missing_claims.forEach(function(c) { html += '<li>✗ ' + esc(c) + '</li>'; });
      html += '</ul></div>';
      if (ec.unsupported_claims && ec.unsupported_claims.length) {
        html += '<div style="font-size:10px;color:var(--amber);margin-top:4px;"><strong>Unsupported:</strong> ';
        html += ec.unsupported_claims.map(function(c) { return esc(c); }).join("; ");
        html += '</div>';
      }
      // Counterevidence
      if (ec.artifact_counterevidence && ec.artifact_counterevidence.length) {
        html += '<div style="font-size:10px;color:var(--red);margin-top:4px;"><strong>Counterevidence:</strong> ';
        ec.artifact_counterevidence.forEach(function(ce) {
          html += esc(ce.file_path + ":" + ce.start_line + "-" + ce.end_line) + ' ';
        });
        html += '</div>';
      }
      html += '</div>';

      // Detected gap
      html += '<div class="gap-block">';
      html += '<span class="gap-label">Detected Gap</span>';
      html += '<span class="gap-severity ' + esc(gap.severity) + '">' + esc(gap.severity) + '</span>';
      html += '<div style="font-size:11px;margin-top:4px;line-height:1.45;">' + esc(gap.evidence) + '</div>';
      if (gap.blocks_readiness) {
        html += '<div class="gap-blocks">🚫 Blocks readiness</div>';
      }
      html += '<div class="gap-evidence">Evidence: ' + esc(gap.kind) + '</div>';
      html += '<div style="font-size:10px;color:var(--text-muted);margin-top:3px;">User evidence ref: ' + esc(gap.user_attempt_ref) + ' · Artifact evidence: ' + gap.artifact_evidence_refs.map(function(r) { return esc(r.file_path + ":" + r.start_line); }).join(", ") + '</div>';
      html += '</div>';

      // Repair action
      html += '<div class="repair-block">';
      html += '<span class="repair-label">Repair Action</span>';
      html += '<div class="repair-prompt">' + esc(repair.prompt) + '</div>';
      html += '<div class="gap-evidence" style="margin-top:4px;">Required evidence: ';
      repair.required_evidence.forEach(function(ev) {
        html += esc(ev.file_path + ":" + ev.start_line + "-" + ev.end_line) + ' ';
      });
      html += '</div>';
      html += '</div>';

      // Readiness claim (scoped)
      html += '<div class="readiness-block">';
      html += '<span class="rc-label">Readiness Claim</span>';
      html += '<span class="rc-scope-badge">scoped</span>';
      html += '<div style="font-size:11px;color:var(--red);font-weight:600;margin-top:2px;">Status: ' + esc(rc.status) + '</div>';
      html += '<div class="rc-scope">' + esc(rc.scope) + '</div>';
      html += '<div class="rc-scope-note">This readiness claim is scoped to one operation and concept slice. It does not imply whole-repo mastery.</div>';
      html += '<ul class="rc-blocked-list">';
      rc.blocked_claims.forEach(function(c) { html += '<li>' + esc(c) + '</li>'; });
      html += '</ul>';
      html += '<div style="font-size:10px;color:var(--text-muted);margin-top:4px;">Blocked by gaps: ' + rc.blocking_gaps.join(", ") + '</div>';
      html += '</div>';

      // ── Retry Controls ──
      html += '<div class="retry-controls">';
      html += '<h3>Continue</h3>';
      html += '<div class="retry-actions">';
      html += '<button class="retry-btn" id="retryAttempt">Try Again</button>';
      html += '<button class="repair-btn" id="executeRepair">Execute Repair Action</button>';
      html += '<button id="resetWorkspace" style="color:var(--text-muted);">Reset</button>';
      html += '</div>';
      html += '<div style="font-size:9px;color:var(--text-muted);margin-top:4px;">Repair actions and retries do not advance readiness — only a successful attempt or satisfying re-evaluation can upgrade readiness (VAL-PED-007).</div>';
      html += '</div>';

      html += '</div>'; // post-attempt
    }

    el("loopContent").innerHTML = html;

    // Bind events
    if (!state.attemptSubmitted) {
      var submitBtn = el("submitAttempt");
      var dunnoBtn = el("dunnoAttempt");
      var sampleBtn = el("useSampleAttempt");

      if (submitBtn) {
        submitBtn.addEventListener("click", function() {
          // Capture selected evidence from checkboxes
          var selectedEv = [];
          Array.from(document.querySelectorAll(".ev-checkbox:checked")).forEach(function(cb) {
            selectedEv.push(cb.dataset.evId);
          });
          // Log the attempt for demo chain observability
          console.log("[Attempt-First] Submitting attempt at " + new Date().toISOString());
          console.log("[Attempt-First] Selected evidence:", selectedEv.join(", "));
          console.log("[Attempt-First] Pre-attempt hidden answer gate: VERIFIED (no solution in DOM/accessibility)");
          state.attemptSubmitted = true;
          renderLoop();
          // Update top bar state
          el("loopState").textContent = "GapOrReady";
          // Run hidden answer gate assertion
          setTimeout(assertHiddenAnswerGated, 50);
        });
      }
      if (dunnoBtn) {
        dunnoBtn.addEventListener("click", function() {
          el("attemptText").value = "I don't know how to trace this mapping.";
          el("attemptConfidence").value = "low";
          state.attemptSubmitted = true;
          renderLoop();
          el("loopState").textContent = "GapOrReady";
        });
      }
      if (sampleBtn) {
        sampleBtn.addEventListener("click", function() {
          var sa = fixture.sample_attempt;
          el("attemptText").value = sa.answer_text;
          el("attemptConfidence").value = sa.declared_confidence;
          el("attemptUnknowns").value = sa.declared_unknowns.join(", ");
          // Pre-select the evidence from sample attempt
          Array.from(document.querySelectorAll(".ev-checkbox")).forEach(function(cb) {
            cb.checked = sa.selected_evidence.indexOf(cb.dataset.evId) !== -1;
          });
        });
      }

      // Hint ladder (progressive, no answer leakage)
      Array.from(el("loopContent").querySelectorAll(".hint")).forEach(function(h) {
        h.addEventListener("click", function() {
          if (state.revealedHints >= (fixture.active_operation.allowed_hints || 3)) {
            showToast("All hints revealed. Submit your attempt to continue.");
            return;
          }
          h.classList.add("revealed");
          state.revealedHints++;
          console.log("[Hint Ladder] Hint " + h.dataset.hint + " revealed. No hidden solution content leaked (VAL-LOOP-014).");
        });
      });
    } else {
      // Post-attempt event bindings
      var retryBtn = el("retryAttempt");
      var repairBtn = el("executeRepair");
      var resetBtn = el("resetWorkspace");

      if (retryBtn) {
        retryBtn.addEventListener("click", function() {
          state.attemptSubmitted = false;
          state.revealedHints = 0;
          renderLoop();
          el("loopState").textContent = "AwaitingAttempt";
          console.log("[Attempt-First] Retry: returning to pre-attempt state. Hidden answer gated again.");
        });
      }
      if (repairBtn) {
        repairBtn.addEventListener("click", function() {
          var repair = fixture.repair_action;
          showToast("Repair action: " + repair.prompt.substring(0, 80) + "…");
          console.log("[Repair] Executing repair action: " + repair.id + " for gap " + repair.gap_id);
          console.log("[Repair] Required evidence: " + repair.required_evidence.map(function(r) { return r.file_path + ":" + r.start_line + "-" + r.end_line; }).join(", "));
          // For the prototype, after a brief delay, transition back to pre-attempt for re-evaluation
          setTimeout(function() {
            state.attemptSubmitted = false;
            state.revealedHints = 0;
            renderLoop();
            el("loopState").textContent = "RepairOrReevaluation";
            var ta = document.querySelectorAll('[data-art="TA-001"]')[0];
            if (ta) ta.click();
          }, 1000);
        });
      }
      if (resetBtn) {
        resetBtn.addEventListener("click", function() {
          state.attemptSubmitted = false;
          state.revealedHints = 0;
          state.selectedEvidence = null;
          state.activeArtifact = "TA-001";
          renderLoop();
          renderArtifact("TA-001");
          renderEvidence();
          el("loopState").textContent = "AwaitingAttempt";
          console.log("[Demo Chain] Reset to beginning of loop.");
        });
      }
    }


    // Run hidden answer gate check
    assertHiddenAnswerGated();
  }

  // ── Render: Evidence Rail ──
  function renderEvidence() {
    var inventory = fixture.evidence_inventory;
    el("evCount").textContent = inventory.length + " items";

    var stripHtml = "";
    inventory.forEach(function(ev) {
      var selClass = state.selectedEvidence && state.selectedEvidence.id === ev.id ? " selected" : "";
      stripHtml += '<div class="ev-card' + selClass + '" data-ev-id="' + esc(ev.id) + '" tabindex="0" role="button" aria-label="Evidence ' + esc(ev.id) + ': ' + esc(ev.path) + '">';
      stripHtml += '<span class="ev-role ' + esc(ev.role) + '">' + esc(ev.role.replace(/_/g, " ")) + '</span>';
      stripHtml += '<div class="ev-path">' + esc(ev.path) + '</div>';
      stripHtml += '<div class="ev-hash">' + esc(ev.content_hash) + '</div>';
      stripHtml += '<div class="ev-excerpt">' + esc(ev.excerpt) + '</div>';
      stripHtml += '<div class="ev-status">' + esc(ev.status) + ' · ' + esc(ev.line_count) + ' lines · ' + esc((ev.size_bytes / 1024).toFixed(1)) + ' KB</div>';
      stripHtml += '</div>';
    });

    el("evidenceStrip").innerHTML = stripHtml;

    // Bind clicks
    Array.from(el("evidenceStrip").querySelectorAll(".ev-card")).forEach(function(card) {
      card.addEventListener("click", function() {
        var evId = card.dataset.evId;
        var ev = inventory.find(function(e) { return e.id === evId; });
        state.selectedEvidence = ev;
        renderEvidence();
        showEvidenceDetail(ev);
      });
      // Keyboard: Enter/Space to select
      card.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          card.click();
        }
      });
    });

    // Collapse button
    el("collapseEvidence").addEventListener("click", function() {
      el("evidenceRail").classList.toggle("collapsed");
      el("collapseEvidence").textContent = el("evidenceRail").classList.contains("collapsed") ? "+" : "—";
    });
  }

  function showEvidenceDetail(ev) {
    if (!ev) { el("evDetail").hidden = true; return; }
    var html = '<div class="ev-detail-header">';
    html += '<span>' + esc(ev.id) + ': ' + esc(ev.path) + '</span>';
    html += '<span class="ev-detail-close" id="closeEvDetail">×</span>';
    html += '</div>';
    html += '<div class="ev-detail-row">';
    html += '<span>Role: <strong>' + esc(ev.role) + '</strong></span>';
    html += '<span>Source type: <strong>' + esc(ev.source_type) + '</strong></span>';
    html += '<span>Hash: <strong>' + esc(ev.content_hash) + '</strong></span>';
    html += '<span>Size: <strong>' + esc((ev.size_bytes / 1024).toFixed(1)) + ' KB</strong></span>';
    html += '<span>Lines: <strong>' + esc(ev.line_count) + '</strong></span>';
    html += '<span>Status: <strong>' + esc(ev.status) + '</strong></span>';
    html += '</div>';
    html += '<div style="margin-top:6px;font-style:italic;font-size:11px;color:var(--text-secondary);">' + esc(ev.excerpt) + '</div>';
    el("evDetail").innerHTML = html;
    el("evDetail").hidden = false;

    el("closeEvDetail").addEventListener("click", function() {
      state.selectedEvidence = null;
      el("evDetail").hidden = true;
      renderEvidence();
    });
  }

  // ── Initial Render ──
  renderArtifact(state.activeArtifact);
  renderLoop();
  renderEvidence();

  // ── Demo Chain Observability Log ──
  console.log("═══════════════════════════════════════════════");
  console.log("Sibar Deep Ownership Workspace — Demo Chain");
  console.log("═══════════════════════════════════════════════");
  console.log("1. Goal:", fixture.goal);
  console.log("2. Boundary:", fixture.artifact_boundary.root_path, "|", fixture.artifact_boundary.included_sources.length, "included,", fixture.artifact_boundary.excluded_sources.length, "excluded");
  console.log("3. Evidence Inventory:", fixture.evidence_inventory.length, "items");
  console.log("4. Concept Slice:", fixture.concept_slice.label);
  console.log("5. Thinking Artifacts:", fixture.thinking_artifacts.length, "artifacts (TA-001 code_slice, TA-002 flow_diagram)");
  console.log("6. Active Operation:", fixture.active_operation.kind, "—", fixture.active_operation.prompt.substring(0, 80) + "…");
  console.log("7. Attempt Gate: Hidden answer gated. Submit your attempt to continue.");
  console.log("8. Evidence Check: Awaiting attempt submission.");
  console.log("9. Gap/Readiness: Pending.");
  console.log("10. Repair Action: Pending.");
  console.log("═══════════════════════════════════════════════");

  console.log("Hint ladder: 3 progressive hints available (no answer leakage)");
  console.log("Prerequisites visible:", fixture.concept_slice.prerequisite_concepts.join(", "));
  console.log("Attempt composer: answer + evidence selection + confidence + unknowns + hints + submit/retry controls ready");
  console.log("═══════════════════════════════════════════════");

  // Log state chain
  var ls = fixture.loop_state;
  console.log("Demo state chain:", ls.state_chain.join(" → "));
